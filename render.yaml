services:
  - type: web
    name: storefront-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: '*'
      - key: LOG_LEVEL
        value: info